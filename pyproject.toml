[project]
name = "sims"
version = "0.1.0"
description = "Student information system for academic offices in Ukrainian higher education institutions."
readme = "README.md"
authors = [
    { name = "Denys Morozov", email = "ajax3101@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.115",
    "openpyxl>=3.1.5",
    "pydantic>=2.10",
    "pydantic-settings>=2.16.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn>=0.54.0",
]

[project.scripts]
sims = "sims.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pypdf>=6.21.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
