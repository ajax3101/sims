services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sims
      POSTGRES_PASSWORD: sims
      POSTGRES_DB: sims
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sims -d sims"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
